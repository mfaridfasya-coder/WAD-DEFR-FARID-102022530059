<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Tambah Ruang Poliklinik</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <nav class="navbar navbar-expand-lg navbar-dark">
        <div class="container">
            <a class="navbar-brand" href="index.html">Klinik Rawat Jalan</a>
            <div class="navbar-nav">
                <a class="nav-link" href="index.html">Daftar Ruang</a>
                <a class="nav-link active" href="form.html">Tambah Ruang</a>
            </div>
        </div>
    </nav>

    <div class="hero text-center">
        <h1>Tambah Ruang Poliklinik</h1>
        <p>Isi data ruangan poli dengan lengkap</p>
    </div>

    <div class="container">
        <div class="card">
            <div class="card-body">
                <form>
                    <div class="mb-3">
                        <label class="form-label">Nama Ruang</label>
                        <input type="text" class="form-control" placeholder="Contoh: Ruang Poli Umum 1">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Jenis Poli</label>
                        <select class="form-select">
                            <option>Poli Umum</option>
                            <option>Poli Gigi</option>
                        </select>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Lokasi Gedung</label>
                        <input type="text" class="form-control" placeholder="Contoh: Gedung A, Lantai 1">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Inventaris Alat Medis</label>
                        <textarea class="form-control" rows="3" placeholder="Contoh: Tensimeter, Stetoskop"></textarea>
                    </div>
                    <button type="submit" class="btn btn-primary">Simpan</button>
                    <a href="index.html" class="btn btn-secondary">Kembali</a>
                </form>
            </div>
        </div>
    </div>

    <footer>&copy; 2026 Klinik Rawat Jalan - Modul Ruang Poliklinik</footer>
</body>

</html>
